AWSTemplateFormatVersion: "2010-09-09"
Description: DBOps Spoke Role - Deploy in target accounts to enable cross-account DB management

Parameters:
  HubAccountId:
    Type: String
    Description: AWS Account ID where DBOps platform is deployed
  EnableProvisioningWrites:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: >-
      Allow DBOps to CREATE resources (restore a cluster from a snapshot or to a
      point in time, add a reader instance, create a custom cluster endpoint).
      These cannot be restricted by the ManagedBy=dbops tag, because the tag
      condition is evaluated against the resource being acted on and the resource
      does not exist yet. Leave "false" unless you want those workflows; the
      corresponding DBOps tools will return AccessDenied while it is off.

Conditions:
  ProvisioningWritesEnabled: !Equals [!Ref EnableProvisioningWrites, "true"]

Resources:
  DBOpsSpokeRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: dbops-spoke-role
      # Trust the whole hub account. The DBOps platform's Lambda roles
      # (dashboard / MCP / ETL collector / cluster-API) each assume this spoke
      # role DIRECTLY. Trusting the account root does NOT by itself grant
      # access: every hub role is individually scoped by its OWN sts:AssumeRole
      # IAM policy (resource = this spoke role ARN), so the trust policy AND the
      # caller's identity policy must BOTH allow. This is the standard AWS
      # hub-spoke pattern — the boundary is the hub account plus each role's
      # identity policy, not a single named role.
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Sub "arn:aws:iam::${HubAccountId}:root"
            Action: "sts:AssumeRole"
      Policies:
        - PolicyName: DBOpsReadOnly
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: RDSReadOnly
                Effect: Allow
                Action:
                  - "rds:Describe*"
                  - "rds:ListTagsForResource"
                  - "rds:DownloadDBLogFilePortion"
                Resource: "*"
              - Sid: PerformanceInsights
                Effect: Allow
                Action:
                  - "pi:GetResourceMetrics"
                  - "pi:DescribeDimensionKeys"
                  - "pi:GetResourceMetadata"
                Resource: "*"
              - Sid: CloudWatch
                Effect: Allow
                Action:
                  - "cloudwatch:GetMetricData"
                  - "cloudwatch:DescribeAlarms"
                  - "cloudwatch:GetMetricStatistics"
                Resource: "*"
              - Sid: CloudWatchLogs
                Effect: Allow
                Action:
                  - "logs:StartQuery"
                  - "logs:GetQueryResults"
                  - "logs:DescribeLogGroups"
                Resource: "*"
              # The DocumentDB profiler collector (data-pipeline/
              # docdb_mongo_collector) reads slow ops with FilterLogEvents, which
              # none of the three actions above cover. Without this, a spoke-account
              # DocumentDB cluster is permanently AND silently blind: rds:Describe*
              # already resolves the profiler state to "on", so only the log read
              # fails. The log-group ARN is the form that authorizes: the service
              # authorization reference lists FilterLogEvents with required
              # resource type log-group (access level Read, condition key
              # aws:ResourceTag/${TagKey}), NOT log-stream. The `:*` form below is
              # not required; it is kept only to mirror the hub grant in
              # cdk/stacks/data_stack.py byte for byte, so a future reader diffing
              # the two does not "fix" one of them. Do not drop the log-group form
              # thinking the `:*` form covers it: AWS own SAM FilterLogEventsPolicy
              # scopes to `:log-stream:*`, which is broader than the reference
              # requires and is not evidence about what authorizes. No
              # aws:ResourceTag condition: the profiler log group is created by the
              # service and carries no DBOps tag, so a tag condition here would
              # deny every read (same class of bug as the snapshot-create grants
              # below).
              - Sid: CloudWatchLogsDocDBProfiler
                Effect: Allow
                Action:
                  - "logs:FilterLogEvents"
                Resource:
                  - "arn:aws:logs:*:*:log-group:/aws/docdb/*"
                  - "arn:aws:logs:*:*:log-group:/aws/docdb/*:*"
              - Sid: RDSDataAPI
                Effect: Allow
                Action:
                  - "rds-data:ExecuteStatement"
                  - "rds-data:BatchExecuteStatement"
                Resource: "*"
              - Sid: SecretsManager
                Effect: Allow
                Action:
                  - "secretsmanager:GetSecretValue"
                # RDS-managed secrets are always named `rds!cluster-*` / `rds!db-*`,
                # so scope by that ARN pattern. (The previous condition
                # `ResourceTag/ManagedBy=rds` never matched: RDS tags its managed
                # secrets `aws:secretsmanager:owningService=rds`, NOT ManagedBy — so
                # cross-account RDS Data API SQL collection failed with AccessDenied
                # "Failed to fetch secret". Caught via live cross-account testing.)
                Resource: "arn:aws:secretsmanager:*:*:secret:rds!*"
              # DocumentDB is authorized under the rds: namespace (AWS docs:
              # "To specify an action, use the rds: prefix followed by the API
              # operation name"), so rds:Describe* above already covers it.
              # ElastiCache and DynamoDB have their OWN namespaces and were
              # missing entirely, so every cross-account read for those two
              # families failed with AccessDenied.
              - Sid: ElastiCacheReadOnly
                Effect: Allow
                Action:
                  - "elasticache:Describe*"
                  - "elasticache:ListTagsForResource"
                Resource: "*"
              - Sid: DynamoDBReadOnly
                Effect: Allow
                Action:
                  - "dynamodb:DescribeTable"
                  - "dynamodb:DescribeContinuousBackups"
                  - "dynamodb:DescribeTimeToLive"
                  - "dynamodb:ListTagsOfResource"
                Resource: "*"
        - PolicyName: DBOpsWriteConditional
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # Writes that act on an EXISTING resource, so the ManagedBy=dbops
              # tag condition is enforceable. This statement used to list only
              # ModifyDBCluster / ModifyDBClusterParameterGroup /
              # CreateDBClusterSnapshot while the operations MCP server actually
              # calls 21 distinct write APIs across rds, elasticache and
              # dynamodb. Every missing action failed with AccessDenied AFTER
              # verify_approval had already CONSUMED the single-use approval, so
              # the DBA's approval was burned and the change did not happen.
              # Same-account deployments never hit this because they do not use a
              # spoke role at all, which is why it went unnoticed.
              - Sid: RDSModifyExisting
                Effect: Allow
                Action:
                  - "rds:ModifyDBCluster"
                  # NB: this one authorizes against the cluster-pg resource, NOT
                  # the cluster, so the PARAMETER GROUP must carry
                  # ManagedBy=dbops too or parameter tuning is denied. See
                  # README "Tag clusters for write access".
                  - "rds:ModifyDBClusterParameterGroup"
                  # Same caveat as ModifyDBClusterParameterGroup above, for the
                  # INSTANCE parameter group of a standalone (non-Aurora) RDS DB
                  # instance: this authorizes against the pg resource, NOT the DB
                  # instance, so the DB PARAMETER GROUP itself must carry
                  # ManagedBy=dbops or the change is denied AFTER the single-use
                  # approval was already consumed.
                  - "rds:ModifyDBParameterGroup"
                  - "rds:ModifyDBInstance"
                  - "rds:RebootDBInstance"
                  - "rds:DeleteDBInstance"
                  - "rds:ModifyDBClusterEndpoint"
                  - "rds:DeleteDBClusterEndpoint"
                  # Turning the RDS Data API on for an already-registered
                  # cluster. Scoped to this single action rather than
                  # ModifyDBCluster so approve-time activation cannot be reused
                  # for arbitrary cluster changes.
                  - "rds:EnableHttpEndpoint"
                Resource: "*"
                Condition:
                  StringEquals:
                    "aws:ResourceTag/ManagedBy": "dbops"
              - Sid: ElastiCacheModifyExisting
                Effect: Allow
                Action:
                  - "elasticache:ModifyReplicationGroup"
                  - "elasticache:RebootCacheCluster"
                  - "elasticache:TestFailover"
                Resource: "*"
                Condition:
                  StringEquals:
                    "aws:ResourceTag/ManagedBy": "dbops"
              - Sid: DynamoDBModifyExisting
                Effect: Allow
                Action:
                  - "dynamodb:UpdateTable"
                  - "dynamodb:UpdateContinuousBackups"
                  - "dynamodb:UpdateTimeToLive"
                Resource: "*"
                Condition:
                  StringEquals:
                    "aws:ResourceTag/ManagedBy": "dbops"
              # Snapshot creation. UNCONDITIONED, and that is deliberate.
              #
              # These three actions were previously inside the
              # aws:ResourceTag/ManagedBy=dbops statements above on the
              # assumption that they authorize against the tagged SOURCE
              # cluster/instance. They don't authorize against it ALONE. Per the
              # AWS service authorization reference, the snapshot being created
              # is itself a REQUIRED resource of the request:
              #   rds:CreateDBClusterSnapshot -> cluster* AND cluster-snapshot*
              #   rds:CreateDBSnapshot        -> db*      AND snapshot*
              #   elasticache:CreateSnapshot  -> snapshot*  (cluster and
              #                                  replicationgroup are OPTIONAL)
              # A resource that does not exist yet carries no tags, so
              # aws:ResourceTag/ManagedBy is absent, StringEquals fails, and the
              # whole call is denied. The failure lands AFTER verify_approval has
              # consumed the single-use approval, so the DBA's approval is burned
              # and no snapshot is taken.
              #
              # aws:RequestTag/ManagedBy=dbops is the condition that WOULD work
              # for a create action, but it is not usable here: the DBOps tools
              # do not send that tag. create_snapshot.py sends only
              # dbops:created-by + dbops:type; create_rds_snapshot.py and
              # create_elasticache_snapshot.py send no tags at all. Requiring it
              # would deny every snapshot instead of scoping it. These stay
              # unconditioned rather than moving behind EnableProvisioningWrites:
              # snapshotting a cluster you already manage is normal backup work,
              # not provisioning, and it creates no compute.
              - Sid: SnapshotCreate
                Effect: Allow
                Action:
                  - "rds:CreateDBClusterSnapshot"
                  - "rds:CreateDBSnapshot"
                  - "elasticache:CreateSnapshot"
                Resource: "*"
              # RDS runs a SECOND authorization, on rds:AddTagsToResource, when a
              # create call carries Tags (RDS User Guide, "Grant permission to tag
              # Amazon RDS resources during creation"; the service authorization
              # reference maps the CreateDBClusterSnapshot / CreateDBSnapshot
              # operations to BOTH rds:CreateDB*Snapshot and
              # rds:AddTagsToResource). create_snapshot.py passes Tags, so without
              # this the snapshot fix above still ends in AccessDenied with the
              # approval already consumed. Scoped by aws:TagKeys to exactly the
              # keys that tool sends, so it cannot be used to relabel arbitrary
              # resources. If create_snapshot.py's tag keys change, add them here
              # or snapshots start failing.
              #
              # DO NOT ADD ManagedBy TO aws:TagKeys, AND DO NOT REMOVE THE CONDITION.
              # The key restriction is a privilege-escalation guard, not tidiness.
              # RDSModifyExisting above gates 9 write actions on
              # aws:ResourceTag/ManagedBy=dbops. If this role could write that tag,
              # it could stamp it on ANY RDS resource in the account and thereby
              # grant itself those 9 writes on anything, which is the whole boundary
              # this template exists to draw.
              #
              # This is a real trap, not a hypothetical: the tag preflight in
              # mcp_servers/shared/managed_tag_preflight.py correctly warns that a
              # cluster is missing ManagedBy, and the obvious next move is to add
              # the tag through DBOps. Attempted 2026-08-03 with the live spoke
              # role: AccessDenied on rds:AddTagsToResource, exactly as intended.
              # The tag must be applied from the TARGET account by a principal that
              # already has tagging rights there. The warning text now says so.
              - Sid: RDSTagOnCreate
                Effect: Allow
                Action:
                  - "rds:AddTagsToResource"
                Resource: "*"
                Condition:
                  "ForAllValues:StringEquals":
                    "aws:TagKeys":
                      - "dbops:created-by"
                      - "dbops:type"
        # Resource-CREATING writes. The ManagedBy tag cannot gate these: IAM
        # evaluates aws:ResourceTag against the resource being acted on, and the
        # cluster/instance/endpoint being created does not exist yet. So they are
        # opt-in via the EnableProvisioningWrites parameter instead of being
        # granted silently. Affected DBOps tools: restore_cluster (snapshot and
        # PITR), add_reader_instance / scale_out_with_warmup, and the custom
        # cluster endpoint creator.
        - !If
          - ProvisioningWritesEnabled
          - PolicyName: DBOpsProvisioningWrites
            PolicyDocument:
              Version: "2012-10-17"
              Statement:
                - Sid: RDSCreateNewResources
                  Effect: Allow
                  Action:
                    - "rds:RestoreDBClusterFromSnapshot"
                    - "rds:RestoreDBClusterToPointInTime"
                    - "rds:CreateDBInstance"
                    - "rds:CreateDBClusterEndpoint"
                  Resource: "*"
          - !Ref "AWS::NoValue"

Outputs:
  SpokeRoleArn:
    Description: ARN of the spoke role - use this when registering the cluster in DBOps
    Value: !GetAtt DBOpsSpokeRole.Arn
