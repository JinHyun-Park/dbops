# Pre-commit hooks — run on `git commit`. Install once:
#   pip install -r requirements-dev.txt && pre-commit install
#
# What this catches BEFORE code reaches origin:
#   - Lint errors on Python (ruff)
#   - Bad formatting on TS/JSON/MD (prettier)
#   - TypeScript compile errors (tsc --noEmit, frontend only)
#   - Trailing whitespace / mixed line endings / accidentally-committed
#     huge files
#
# Skip occasionally with `git commit --no-verify`, but the CI pipeline
# re-runs everything so anything you skip locally gets caught on push.

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: \.md$
      - id: end-of-file-fixer
      - id: check-yaml
        # CloudFormation templates use !GetAtt / !Ref / !Sub tags that vanilla
        # PyYAML can't resolve. Skip them — `cfn-lint` would be the right tool
        # if we wanted real validation on those files.
        exclude: ^cdk/cross-account/.*\.yaml$
      - id: check-json
      - id: check-added-large-files
        args: ["--maxkb=512"]
      - id: check-merge-conflict

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: ["--fix"]

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.1.0
    hooks:
      - id: prettier
        files: \.(ts|tsx|js|jsx|css|json|md|yml|yaml)$
        exclude: |
          (?x)^(
            frontend/out/.*|
            cdk\.out/.*|
            cdk/cdk\.out/.*|
            frontend/\.next/.*|
            .*/_deps/.*|
            .*/__snapshots__/.*
          )$

  # Frontend type check — must pass for any TS/TSX change. We invoke the
  # local frontend's tsc via a small system hook so dependencies stay
  # pinned in package.json rather than being duplicated here.
  - repo: local
    hooks:
      - id: frontend-typecheck
        name: frontend typecheck (tsc --noEmit)
        entry: bash -c 'cd frontend && npx --no-install tsc --noEmit'
        language: system
        files: ^frontend/.*\.(ts|tsx)$
        pass_filenames: false

      # Secret scan on the STAGED changes, so a flagged string is caught before
      # it becomes a commit rather than after it becomes a push.
      #
      # This exists because of a real miss: the CI `secrets` job was added, the
      # history verified clean, and then two files were committed that tripped
      # it — a doc QUOTING the string it was explaining, and a test using a
      # JWT-shaped literal. Both reached main and failed CI, because nothing
      # re-ran the gate between "gate is green" and "push".
      #
      # `protect --staged` scans the staged diff only (fast, no history walk);
      # the CI job still owns the full-history scan. Skipped silently when
      # gitleaks is not installed locally, so a contributor without it is not
      # blocked — CI remains the authority.
      - id: gitleaks-staged
        name: gitleaks (staged changes)
        entry: bash -c 'command -v gitleaks >/dev/null || { echo "gitleaks not installed - skipping (CI still enforces)"; exit 0; }; gitleaks protect --staged --config .gitleaks.toml --redact --no-banner'
        language: system
        pass_filenames: false
