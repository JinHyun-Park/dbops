# Pre-commit hooks — run on `git commit`. Install once:
#   pip install -r requirements-dev.txt && pre-commit install
#
# What this catches BEFORE code reaches origin:
#   - Lint errors on Python (ruff)
#   - Bad formatting on TS/JSON/MD (prettier)
#   - TypeScript compile errors (tsc --noEmit, frontend only)
#   - Trailing whitespace / mixed line endings / accidentally-committed
#     huge files
#
# Skip occasionally with `git commit --no-verify`, but the CI pipeline
# re-runs everything so anything you skip locally gets caught on push.

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: \.md$
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files
        args: ["--maxkb=512"]
      - id: check-merge-conflict

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: ["--fix"]

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.1.0
    hooks:
      - id: prettier
        files: \.(ts|tsx|js|jsx|css|json|md|yml|yaml)$
        exclude: |
          (?x)^(
            frontend/out/.*|
            cdk\.out/.*|
            cdk/cdk\.out/.*|
            frontend/\.next/.*|
            .*/_deps/.*|
            .*/__snapshots__/.*
          )$

  # Frontend type check — must pass for any TS/TSX change. We invoke the
  # local frontend's tsc via a small system hook so dependencies stay
  # pinned in package.json rather than being duplicated here.
  - repo: local
    hooks:
      - id: frontend-typecheck
        name: frontend typecheck (tsc --noEmit)
        entry: bash -c 'cd frontend && npx --no-install tsc --noEmit'
        language: system
        files: ^frontend/.*\.(ts|tsx)$
        pass_filenames: false
