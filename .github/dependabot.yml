# Dependabot keeps dependencies patched automatically. Minor/patch bumps are
# grouped into a single weekly PR per ecosystem to keep review noise low;
# major bumps still open individually so they get deliberate review.
version: 2
updates:
  # Frontend (Next.js static export) npm dependencies.
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        update-types: ["minor", "patch"]
    ignore:
      # TypeScript must stay on 6.x until Next.js supports the 7.x compiler API.
      # Measured 2026-07-31 by actually installing 7.0.2 and running both checks,
      # because they DISAGREE and only one of them is the whole story:
      #
      #   npx tsc --noEmit   CLEAN   (the standalone compiler is happy)
      #   npm run build      FAILS   "TypeScript 7.0.2 does not provide the
      #                               compiler API required by Next.js. ... or
      #                               install TypeScript 6 instead."
      #
      # Next 16.2.12 drives typechecking through the TS compiler API, which 7.x
      # changed. Trusting the typecheck alone would have merged a broken build.
      #
      # Next offers `experimental.useTypeScriptCli` as a way through, and that is
      # deliberately NOT taken: opting a production build into an experimental
      # flag to satisfy a dev-dependency bump is the wrong trade. Lift this when
      # Next supports the 7.x API on a stable path.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  # Python dependencies across CDK, the agent, every MCP server, and every
  # data-pipeline Lambda. Globs pick up nested per-service requirements files.
  - package-ecosystem: "pip"
    directories:
      - "/"
      - "/cdk"
      - "/agent"
      - "/mcp-servers"
      - "/mcp-servers/**"
      - "/data-pipeline/**"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      pip-minor-patch:
        update-types: ["minor", "patch"]
    ignore:
      # cdk-nag MUST stay on the 2.x line: 3.x REMOVED the `NagSuppressions` API
      # that cdk/app.py imports and uses at 8 call sites.
      #
      # Measured 2026-07-31 by installing cdk-nag 3.0.1 in an isolated venv and
      # running the real nag gate, NOT by reading version metadata:
      #
      #   pip install cdk-nag==3.0.1   installs cleanly
      #   CDK_NAG=1 cdk synth          ImportError: cannot import name
      #                                'NagSuppressions' from 'cdk_nag'
      #
      # 3.x exports only WriteNagSuppressionsToCloudFormationAspect, so taking it
      # means rewriting all 8 suppression call sites (add_stack_suppressions x6,
      # add_resource_suppressions_by_path x2) against the new aspect mechanism.
      #
      # CORRECTION: an earlier version of this comment claimed the blocker was a
      # version conflict dragging aws-cdk-lib past a cloud-assembly schema
      # boundary. That was wrong on both halves. cdk-nag 3.0.1's floor is
      # aws-cdk-lib>=2.257.0 and a fresh resolve already installs 2.262.2, so the
      # requirement is SATISFIED, not conflicting. The schema-54 wall is real but
      # unrelated to cdk-nag: it is aws-cdk-lib 2.262.x versus a CDK CLI older
      # than 2.1134.0, and CI installs `aws-cdk@2` so CI never hits it. See
      # cdk/requirements.txt for that one.
      #
      # This ignore exists because Dependabot opened the same major bump TWICE
      # (#39 and #43, byte-identical) and closing them by hand only buys a week.
      # cdk/requirements.txt already pins `<3`, but a version-requirement update
      # rewrites the constraint itself, so the pin cannot defend against it.
      #
      # Lift this once the 8 suppression call sites are migrated to 3.x, and not
      # before.
      - dependency-name: "cdk-nag"
        update-types: ["version-update:semver-major"]

  # GitHub Actions pinned in the CI / E2E workflows.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
