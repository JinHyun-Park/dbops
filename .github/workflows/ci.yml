name: CI

# Runs on every push + every PR. Independent jobs in parallel so a slow one
# doesn't block the others' feedback.

on:
  push:
    branches: [main, "feat/**", "fix/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: secrets (gitleaks, full history)
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 is load-bearing. gitleaks in git mode scans COMMITS, so a
      # shallow clone would scan only the tip and report clean for a secret still
      # sitting in history, which is exactly what a public repo exposes. Verified
      # locally: a planted secret committed and then scanned exits 1; the clean
      # tree exits 0 over all 900 commits.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: gitleaks (exit code is the gate)
        # Pinned release, not a moving action tag, so nothing in this gate can
        # change under us. `detect` walks the whole history and exits non-zero on
        # any finding. --redact keeps the matched value out of the CI log, which
        # would otherwise become the leak. Asset name verified against the GitHub
        # release API (gitleaks_<ver>_linux_x64.tar.gz).
        run: |
          set -euo pipefail
          VER=8.30.1
          curl -sSfL -o /tmp/gitleaks.tgz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VER}/gitleaks_${VER}_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          /tmp/gitleaks version
          /tmp/gitleaks detect --source . --config .gitleaks.toml --redact --no-banner

  python:
    name: python (pytest + ruff)
    runs-on: ubuntu-latest
    env:
      # Several tests construct boto3 clients (without mocking) — they fail
      # locally too on a machine without AWS_DEFAULT_REGION. Pin a value so
      # CI doesn't hit `NoRegionError`. The region itself is meaningless
      # because no real AWS calls fire — only client construction.
      AWS_DEFAULT_REGION: us-east-1
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements-dev.txt
      - name: install dev deps
        run: pip install -r requirements-dev.txt
      - name: ruff
        run: ruff check .
      - name: pytest (unit)
        run: pytest tests/unit -q

  cdk-synth:
    name: cdk (synth + snapshot)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements-dev.txt
      - name: install dev deps
        run: pip install -r requirements-dev.txt
      - name: seed gitignored settings.py from template
        # CI doesn't have the user's deployment-specific settings.py — copy
        # the committed template so synth has all required Settings fields.
        run: cp cdk/config/settings.example.py cdk/config/settings.py
      - name: cdk synth smoke test
        run: pytest tests/cdk -q

      # ----- cdk-nag gate (AwsSolutions ruleset) -----
      # Fails the build if any unsuppressed AwsSolutions finding is introduced,
      # so new IaC misconfigurations can't be merged. cdk-nag only runs when
      # CDK_NAG=1 (app.py gate) — normal deploys are untouched.
      - name: install cdk-nag (pinned 2.x via cdk/requirements.txt)
        # cdk-nag MUST stay on the 2.x line: 3.x removed the `NagSuppressions`
        # API that cdk/app.py imports, so synth dies at import with
        # "cannot import name 'NagSuppressions' from 'cdk_nag'" (measured
        # 2026-07-31 against cdk-nag 3.0.1). cdk/requirements.txt pins
        # `cdk-nag>=2.28,<3`; install it as-is, and do NOT add or upgrade
        # cdk-nag here. Full reasoning: cdk/requirements.txt.
        run: pip install -r cdk/requirements.txt
      - name: install CDK CLI (latest of the 2.x line)
        # The smoke test above uses a Python-level synth; the nag gate needs the
        # real `cdk synth` exit code.
        #
        # `aws-cdk@2` resolves the LATEST 2.x CLI, and that is load-bearing, not
        # incidental: aws-cdk-lib 2.262.x emits cloud-assembly schema 54, which
        # needs CLI >= 2.1134.0 to read. Do NOT narrow this to an older 2.x pin.
        # Measured 2026-07-31: a 2.1111.0 CLI fails this exact synth with
        # "Maximum schema version supported is 53.x.x, but found 54.0.0".
        # (The CLI's compatibility is with aws-cdk-lib, not with cdk-nag.)
        run: npm install -g aws-cdk@2
      - name: stub frontend/out for synth (no frontend build in this job)
        # FrontendStack's BucketDeployment needs frontend/out/ (and the hashed
        # _next/static subtree) to exist at synth time. The frontend build is a
        # separate job, so stub the minimal asset tree — same as tests/cdk does.
        run: |
          mkdir -p frontend/out/_next/static
          [ -f frontend/out/index.html ] || printf '<!-- synth stub -->\n' > frontend/out/index.html
          [ -f frontend/out/_next/static/.synth-stub ] || printf '// synth stub\n' > frontend/out/_next/static/.synth-stub
      - name: cdk-nag synth gate
        # AwsSolutionsChecks fails synth (non-zero exit) on any unsuppressed
        # finding: the exit code IS the gate, no grep needed. No AWS creds are
        # required: there are no from_lookup() calls, and the one AZ context
        # lookup for the settings.example.py account is pre-seeded in the
        # `context` block of cdk/cdk.json.
        #
        # It used to live in cdk/cdk.context.json. That file is now GITIGNORED,
        # because CDK keys context by AWS account id and a tracked copy publishes
        # the operator's real account. cdk.json's context bag is read-only to the
        # CLI (only cdk.context.json is ever rewritten), so the seeded entry
        # cannot drift. Measured 2026-07-31 on a clean archive of HEAD with
        # credentials, config and IMDS all unavailable: `cdk synth --no-lookups`
        # exits 0 and produces all 4 templates, and the CLI does not recreate
        # cdk.context.json.
        #
        # If a new context lookup is ever added, this job fails with a
        # missing-context error naming the key: add that key to cdk/cdk.json.
        working-directory: cdk
        env:
          CDK_NAG: "1"
          # agent/_deps is gitignored, so it is absent in CI exactly as in a fresh
          # clone, and cdk/vendored_deps.py REFUSES that by default: a deploy from such
          # a synth would ship an agent with zero vendored dependencies and every chat
          # turn would fail at import. This job is a structural gate that never
          # deploys, so it opts out, the same way the step above stubs frontend/out.
          # Never set this anywhere that can reach `cdk deploy`.
          DBOPS_SYNTH_WITHOUT_AGENT_DEPS: "1"
        run: cdk synth >/dev/null

  frontend:
    name: frontend (build + typecheck)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: install deps
        run: npm ci
      - name: typecheck
        run: npx tsc --noEmit
      - name: build
        run: npm run build
