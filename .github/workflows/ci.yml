name: CI

# Runs on every push + every PR. Three independent jobs in parallel so a
# slow one doesn't block the others' feedback.

on:
  push:
    branches: [main, "feat/**", "fix/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: python (pytest + ruff)
    runs-on: ubuntu-latest
    env:
      # Several tests construct boto3 clients (without mocking) — they fail
      # locally too on a machine without AWS_DEFAULT_REGION. Pin a value so
      # CI doesn't hit `NoRegionError`. The region itself is meaningless
      # because no real AWS calls fire — only client construction.
      AWS_DEFAULT_REGION: us-east-1
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements-dev.txt
      - name: install dev deps
        run: pip install -r requirements-dev.txt
      - name: ruff
        run: ruff check .
      - name: pytest (unit)
        run: pytest tests/unit -q

  cdk-synth:
    name: cdk (synth + snapshot)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements-dev.txt
      - name: install dev deps
        run: pip install -r requirements-dev.txt
      - name: seed gitignored settings.py from template
        # CI doesn't have the user's deployment-specific settings.py — copy
        # the committed template so synth has all required Settings fields.
        run: cp cdk/config/settings.example.py cdk/config/settings.py
      - name: cdk synth smoke test
        run: pytest tests/cdk -q

  frontend:
    name: frontend (build + typecheck)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: install deps
        run: npm ci
      - name: typecheck
        run: npx tsc --noEmit
      - name: build
        run: npm run build
